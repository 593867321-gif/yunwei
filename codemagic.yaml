# =============================================================================
#  Codemagic 配置 —— 优达客运维端 iOS 正式版（IPA）构建
#
#  为什么需要它：本机是 Windows，无法运行 xcodebuild；Codemagic 提供 macOS 构建机。
#  为什么自带 local_deps：原私有依赖 flutter_lib.git 返回 403，Codemagic 构建机同样
#    无法访问，故仓库内自带功能替代库，pubspec.yaml 已改为 path 依赖指向它。
#
#  本文件已按 Codemagic 官方 iOS 签名文档（docs.codemagic.io/yaml-code-signing/signing-ios）
#  的「distribution_type + bundle_identifier」方式编写。该方式下，证书与 profile 会在
#  构建时自动获取并装入 keychain，无需手写 keychain initialize 等 CLI 命令。
#
#  使用前必须完成（详见《iOS-CI构建指引.md》第三节）：
#    1. 在 Codemagic 控制台 Team settings 配置签名材料（二选一）：
#       a) Developer Portal 绑定 App Store Connect API Key（推荐，可自动管理证书/profile）
#       b) 手动上传 .p12 证书 + .mobileprovision profile
#    2. 在下方 integrations 填入 App Store Connect 集成名（若走 a 方案）
#    3. 把 <占位符> 全部替换为真实值
# =============================================================================

workflows:
  ios-release:
    name: 优达客运营 iOS 正式版
    max_build_duration: 60
    instance_type: mac_mini_m2          # Apple Silicon 构建机
    integrations:
      # 已启用「App Store Connect API Key 自动签名」：
      # youdake-asc = 你在 Codemagic Team settings > Team integrations > Developer Portal 里添加的 key 名
      app_store_connect: youdake-asc
    environment:
      flutter: 3.41.4                   # 与项目 README/AGENTS.md 要求一致
      xcode: latest                     # 构建机最新稳定 Xcode
      cocoapods: default
      # iOS 签名：采用「引用名」方式（provisioning_profiles + certificates）。
      #
      # 🔴 为什么不用 distribution_type + bundle_identifier 自动拉取：
      #   Apple 账号里唯一的分发证书是 "Distribution Managed"（Xcode Cloud 云端托管证书），
      #   其私钥由 Apple 保管、任何人无法下载。自动拉取会得到一张无私钥的证书并中止：
      #   "Cannot save Signing Certificates without certificate private key"。
      #   官方规定：用引用名方式时，不得再配置 distribution_type / bundle_identifier。
      #
      # 前置准备（在控制台完成，详见 README）：
      #   1) Team settings > Code signing identities > iOS certificates > Generate certificate
      #      类型选 Apple Distribution，使用 API Key youdake-asc；下载 .p12（仅此一次）
      #   2) 同页 Upload certificate 上传该 .p12，引用名必须为 youdake_dist
      #   3) Apple 后台 Profiles 新建 Ad Hoc 描述文件（选该证书 + 全部 6 台设备），
      #      下载 .mobileprovision，上传到 iOS provisioning profiles，引用名必须为 youdake_adhoc
      ios_signing:
        provisioning_profiles:
          - youdake_adhoc
        certificates:
          - youdake_dist
      # 🔴 后端地址与推送密钥不入库、不经过任何人，只从 Codemagic 加密环境变量注入。
      # 在 Codemagic 该 App 的 Environment variables 里直接添加 4 个 App 级变量（勾 Secret）：
      #   ENV=release  API_HOST=...  PUSH_APP_KEY=...  PUSH_APP_SECRET=...
      # App 级变量自动注入所有 workflow，无需建组。
    cache:
      cache_paths:
        - ~/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: 配置国内镜像（加速 pub 下载；海外构建机可删除此步）
        script: |
          export PUB_HOSTED_URL="https://pub.flutter-io.cn"
          export FLUTTER_STORAGE_BASE_URL="https://storage.flutter-io.cn"

      # 说明：此处【不需要】keychain initialize / fetch-signing-files / keychain add-certificates。
      # 采用引用名方式（ios_signing.provisioning_profiles + certificates）时，
      # Codemagic 会在构建过程中自动把引用的证书与描述文件装入 keychain。
      # 官方文档明确：Steps `Initialize keychain` & `Add certificates to keychain` are not required。
      #
      # 之前的 fetch-signing-files --create 必须移除：它会从 Apple 下载那张
      # "Distribution Managed" 托管证书（私钥由 Apple 保管、无法下载），
      # 必然报 "Cannot save Signing Certificates without certificate private key"。
      - name: 设置 Xcode 代码签名
        # 把上面引用的 Ad Hoc 描述文件应用到 Xcode 工程，并生成 export_options.plist。
        # --archive-method 限定只使用 ad-hoc 类型的 profile，避免套用错误类型。
        script: xcode-project use-profiles --archive-method=ad-hoc

      - name: 安装 Flutter 依赖（path 指向 local_deps 替代库）
        script: flutter pub get

      - name: 代码生成（@JsonSerializable/@RestApi/freezed，必须）
        script: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 生成本地化代码
        script: flutter gen-l10n

      - name: 安装 iOS 原生依赖（CocoaPods）
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: 构建 release IPA
        script: |
          # 🔴 ENV / API_HOST 直接写死，不读控制台变量。
          # 原因（实测踩坑）：首次构建产出的 IPA 里，二进制中 `youdake.com/team` 与默认的
          # `youdake.cn/team` 都是 0 次命中，而源码硬编码的 `oss.youdake.com` 能搜到，
          # 证明不是搜索方法问题，而是 API_HOST 被定义为「空字符串」。
          # Dart 的 String.fromEnvironment 语义：只要 key 被 --dart-define 定义过，
          # 即使值为空也不会回落到 defaultValue，于是 Env.ROOT_URL 变成 ""，
          # 装上后所有接口请求都会失败（登录不上）。
          # 这两个值不是机密（AGENTS.md 与 env_release.json 里本就是明文），写死最稳。
          #
          # 🔴 PUSH_APP_KEY / PUSH_APP_SECRET 是机密，仍从控制台加密变量注入，绝不写进仓库。
          # 下面只打印「长度」用于诊断变量是否为空，不输出值本身。
          echo "诊断（只看长度，不输出值）: PUSH_APP_KEY len=${#PUSH_APP_KEY}, PUSH_APP_SECRET len=${#PUSH_APP_SECRET}"
          if [ "${#PUSH_APP_KEY}" -eq 0 ] || [ "${#PUSH_APP_SECRET}" -eq 0 ]; then
            echo "⚠️ 警告：推送密钥变量为空，构建会继续，但装出的包收不到推送。请到控制台 Environment variables 重新填写这两个值。"
          fi
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist \
            --dart-define=ENV=release \
            --dart-define=API_HOST=https://youdake.com/team/ \
            --dart-define=PUSH_APP_KEY=$PUSH_APP_KEY \
            --dart-define=PUSH_APP_SECRET=$PUSH_APP_SECRET
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # 说明：此处刻意不配置 publishing.email —— Codemagic 严格校验 recipients 必须是
    # 合法邮箱地址，占位符会导致整个 codemagic.yaml 校验失败、构建无法启动。
    # 邮件通知仅用于构建结果提醒，与产出 IPA 无关，故移除。
    # 如需通知，在控制台 App settings > Notifications 里配置，或在此填入真实邮箱后取消注释：
    # publishing:
    #   email:
    #     recipients:
    #       - you@example.com
    #     notify:
    #       success: true
    #       failure: true

  # ===========================================================================
  #  TestFlight 灰度测试工作流（与上面的 ad-hoc 工作流并存，互不影响）
  #
  #  用途：把包上传到 App Store Connect，供 TestFlight 测试员安装。
  #        内部测试员最多 100 人（免审核）；外部测试员最多 10000 人
  #        （首个构建需过 Beta App Review，约 1-2 天）。
  #        构建版本自上传起最长可测 90 天，过期需重传。
  #
  #  🔴 与 ad-hoc 的区别：签名用的是「App Store 类型」描述文件，
  #     不是 ad-hoc 类型。两者不能混用，所以必须单独建一个 profile
  #     并以引用名 youdake_appstore 上传到 Codemagic（见 README 第九节）。
  #
  #  为什么仍用引用名方式而非 distribution_type 自动拉取：
  #     账号里那张 "Distribution Managed" 是云端托管证书、私钥下载不到，
  #     自动拉取必然报 "Cannot save Signing Certificates without certificate private key"。
  #     证书复用已验证可用的 youdake_dist（Apple Distribution，ad-hoc/App Store 通用）。
  # ===========================================================================
  ios-testflight:
    name: 优达客运营 iOS TestFlight 灰度
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # 上传构建到 App Store Connect 只需 App Manager 权限，youdake-asc 正好是
      # （之前 401 只发生在「创建证书」，那需要 Admin；上传构建不受影响）
      app_store_connect: youdake-asc
    environment:
      flutter: 3.41.4
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - youdake_appstore        # ← App Store 类型，需在 Apple 后台新建后上传
        certificates:
          - youdake_dist            # ← 复用已验证可用的 Apple Distribution 证书
    cache:
      cache_paths:
        - ~/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: 配置国内镜像（加速 pub 下载）
        script: |
          export PUB_HOSTED_URL="https://pub.flutter-io.cn"
          export FLUTTER_STORAGE_BASE_URL="https://storage.flutter-io.cn"

      - name: 设置 Xcode 代码签名
        # archive-method 必须是 app-store，与 profile 类型一致
        script: xcode-project use-profiles --archive-method=app-store

      - name: 安装 Flutter 依赖（path 指向 local_deps 替代库）
        script: flutter pub get

      - name: 代码生成（@JsonSerializable/@RestApi/freezed，必须）
        script: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 生成本地化代码
        script: flutter gen-l10n

      - name: 安装 iOS 原生依赖（CocoaPods）
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: 构建 release IPA（App Store 签名）
        script: |
          # ENV / API_HOST 写死（非机密，理由同 ad-hoc 工作流：控制台变量曾注入为空，
          # 导致 ROOT_URL="" 而全部接口失败）。推送密钥仍走加密变量。
          echo "诊断（只看长度，不输出值）: PUSH_APP_KEY len=${#PUSH_APP_KEY}, PUSH_APP_SECRET len=${#PUSH_APP_SECRET}"
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist \
            --dart-define=ENV=release \
            --dart-define=API_HOST=https://youdake.com/team/ \
            --dart-define=PUSH_APP_KEY=$PUSH_APP_KEY \
            --dart-define=PUSH_APP_SECRET=$PUSH_APP_SECRET
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        # 复用 integrations 里引用的 youdake-asc 做认证，不把 .p8 内容写进仓库
        auth: integration
        # 上传后自动提交 TestFlight 审核（外部测试需要；内部测试员无需审核即可装）
        submit_to_testflight: true
        # 新构建提交前，自动让上一个「正在审核/等待审核」的构建过期，避免堆积
        expire_build_submitted_for_review: true
        # 🔴 beta_groups 暂时留空：必须先在 App Store Connect 里建好测试组，
        #    这里填不存在的组名会导致 publishing 失败。建好组后取消下面两行注释：
        # beta_groups:
        #   - 你的内部测试组名
        # 刻意不配 submit_to_app_store —— 目标是灰度测试，不上架公开分发。
        # 中国区上架还需 ICP 备案号等合规材料，那是另一件事。
